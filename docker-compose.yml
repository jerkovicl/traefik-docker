# Nginx File Browser - Http File Server
  nginx-file-browser:
    image: mohamnag/nginx-file-browser:latest
    container_name: nginx-file-browser
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${USERDIR}/docker/nginx_file_browser:/opt/www/files/:ro # Location you want to index
    networks:
      - traefik_proxy
#    ports:
#      - "80:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-file-browser.rule=Host(`file-server.${DOMAINNAME}`)"
      - "traefik.http.routers.nginx-file-browser.entrypoints=websecure-internal,websecure-external"
      - "traefik.http.routers.nginx-file-browser.tls=true"
      - "traefik.http.routers.nginx-file-browser.middlewares=middlewares-secure-headers@file"
      - "traefik.http.services.nginx-file-browser.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_proxy"

# Duplicati - Backups cloud management
  duplicati:
    image: linuxserver/duplicati
    container_name: duplicati
    volumes:
      - ${USERDIR}/docker/duplicati:/config
      - ${USERDIR}/backups:/backups
      - ${USERDIR}/docker:/source
      - /etc/localtime:/etc/localtime:ro
      - ${USERDIR}/docker/shared:/shared
#    ports:
#      - "XXXX:8200"
    restart: always
    environment:
      - PUID=0 #${PUID}
      - PGID=0 #${PGID}
      - TZ=${TZ}
      - SETTINGS_ENCRYPTION_KEY=${MYSQL_ROOT_PASSWORD}
      - CLI_ARGS= #optional
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duplicati.rule=Host(`duplicati.${DOMAINNAME}`)"
      - "traefik.http.routers.duplicati.entrypoints=websecure-internal"
      - "traefik.http.routers.duplicati.tls=true"
      - "traefik.http.routers.duplicati.middlewares=secured@file"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"
      - "traefik.docker.network=traefik_proxy"

# code-server - vscode in a browser
  code-server:
    image: linuxserver/code-server
    container_name: code-server
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PASSWORD=${KEYCLOAK_PASSWORD} #optional
      - SUDO_PASSWORD=${KEYCLOAK_PASSWORD} #optional
      - DEFAULT_WORKSPACE=/workspace
      
    volumes:
      - ${USERDIR}/docker/vscode/config:/config # For github integration, drop your ssh key in to /config/.ssh.
      - ${USERDIR}/docker:/workspace
    #ports:
    #  - 8443:8443
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`code.${DOMAINNAME}`)"
      - "traefik.http.routers.code-server.entrypoints=websecure-internal"
      - "traefik.http.routers.code-server.tls=true"
      - "traefik.http.routers.code-server.middlewares=secured@file"
      - "traefik.http.services.code-server.loadbalancer.server.port=8443"
      - "traefik.docker.network=traefik_proxy"
      

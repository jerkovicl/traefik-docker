######### DOCKER RELATED ##########

# Watchtower - Automatic Update of Containers/Apps
  watchtower:
    container_name: watchtower
    hostname: watchtower
    restart: always
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_NOTIFICATIONS=slack
      - WATCHTOWER_NOTIFICATION_SLACK_HOOK_URL=${SLACK_WEBHOOK_URL}
      - WATCHTOWER_NOTIFICATION_SLACK_IDENTIFIER=watchtower
      - WATCHTOWER_NOTIFICATION_SLACK_CHANNEL=#docker
      - WATCHTOWER_DISABLE_CONTAINERS=homeassistant,hassio_supervisor,addon_45df7312_zigbee2mqtt
    command: --schedule "0 0 4 * * *" --cleanup --debug
    # command: --schedule "0 0 4 * * *" --cleanup --debug --label-enable
    # add label - com.centurylinklabs.watchtower.enable="false"
    # verify - docker run -v /var/run/docker.sock:/var/run/docker.sock containrrr/watchtower --run-once --label-enable
    
# Docker Garbage Collector
  dockergc: 
    container_name: docker-gc
    image: clockworksoul/docker-gc-cron:latest
    #network_mode: "host"
    restart: always
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock
      - ${USERDIR}/docker/shared/docker-gc-exclude:/etc/docker-gc-exclude
    environment: 
      - CRON=0 9,21 * * *
      - FORCE_IMAGE_REMOVAL=1
      - FORCE_CONTAINER_REMOVAL=1
      - MINIMUM_IMAGES_TO_SAVE=1
      - GRACE_PERIOD_SECONDS=3600
      - DRY_RUN=0
      - CLEAN_UP_VOLUMES=1
      - TZ=${TZ}
      
# Dozzle - realtime log viewer for docker containers
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Use socket-proxy instead of mounting docker.sock directly
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOZZLE_LEVEL=info
      # Delegate auth to Authentik via forward-proxy (secured@file chain handles it)
      - DOZZLE_AUTH_PROVIDER=forward-proxy
      - DOZZLE_HOSTNAME=${DOMAINNAME}
    volumes:
      # Persists notification settings across restarts
      - ${USERDIR}/docker/dozzle:/data
    networks:
      - traefik_proxy
      - socket_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.${DOMAINNAME}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure-internal"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.middlewares=secured@file"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_proxy"
      
# Cloudflare DDNS
  cloudddns:
    container_name: cloudddns
    restart: always
    image: joshava/cloudflare-ddns
    volumes:
      - ${USERDIR}/docker/shared/config.yml:/app/config.yaml
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}

# Traefik Certificate Extractor
  #https://hub.docker.com/r/ldez/traefik-certs-dumper
  certsdump:
    container_name: certsdump
    image: ldez/traefik-certs-dumper:v2.11.2
    # Wait until acme.json exists AND contains at least one certificate before
    # starting the dumper. This guards against the race condition on first boot
    # where Traefik hasn't obtained its LE cert yet. Once ready, --watch keeps
    # the process alive and re-dumps on every renewal (~every 60 days).
    entrypoint: sh -c '
      while ! [ -e /acme.json ] ||
        ! [ `jq ".[] | .Certificates | length" /acme.json | jq -s "add"` != 0 ]; do
        sleep 1;
      done
      && traefik-certs-dumper file
        --version v3
        --watch
        --source /acme.json
        --dest /dump/live
        --domain-subdir
        --crt-name=fullchain
        --key-name=privkey
        --crt-ext=.pem
        --key-ext=.pem'
    volumes:
      - ${USERDIR}/docker/traefik/acme/acme.json:/acme.json:ro
      - ${USERDIR}/docker/shared/letsencrypt/etc:/dump
    restart: unless-stopped

######### DOWNLOADERS ##########

# qBittorrent without VPN – Bittorrent Downloader
  qbittorrent:
    image: "linuxserver/qbittorrent"
    container_name: "qbittorrent"
    volumes:
      - ${USERDIR}/docker/qbittorrent:/config
      - ${USERDIR}/Downloads/completed:/downloads
      - ${USERDIR}/docker/shared:/shared
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
      - WEBUI_PORT=8080
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.${DOMAINNAME}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure-internal"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.middlewares=secured@file"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_proxy"
      
# Flood - modern web UI for various torrent clients
# use http://qbittorrent:8080 as url in flood settings
  flood:
    image: jesec/flood
    container_name: flood
    hostname: flood
    restart: always
    user: ${PUID}:${PGID}
    command: --port 3002 --allowedpath /data --rundir=/config
    volumes:
      - ${USERDIR}/docker/flood:/config
      - ${USERDIR}/Downloads/completed:/data
    environment:
      - HOME=/config
      - TZ=${TZ}
    ports:
      - "3002:3002"
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flood.rule=Host(`flood.${DOMAINNAME}`)"
      - "traefik.http.routers.flood.entrypoints=websecure-internal"
      - "traefik.http.routers.flood.tls=true"
      - "traefik.http.routers.flood.middlewares=secured@file"
      - "traefik.http.services.flood.loadbalancer.server.port=3002"
      - "traefik.docker.network=traefik_proxy"

# SABnzbd – Usenet (NZB) Downloader
  sabnzbd:

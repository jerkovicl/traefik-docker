# Plex Media Server
  plexms:
    container_name: plexms
    restart: always
    image: plexinc/pms-docker
    #devices:
    #  - /dev/dri:/dev/dri # have a Plex Pass and an Intel processor with QuickSync for harware transcoding
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${USERDIR}/docker/plexms:/config
      - ${USERDIR}/Downloads/plex_tmp:/transcode
      #- /dev/shm:/transcode # Offload transcoding to RAM if you have enough RAM
      - /mnt/storage/media:/media
      - ${USERDIR}/docker/shared:/shared
    ports:
      - "32400:32400/tcp"
      - "3005:3005/tcp" # controlling Plex Home Theater via Plex Companion
      - "8324:8324/tcp" # controlling Plex for Roku via Plex Companion
      - "32469:32469/tcp"
      - "1900:1900/udp" # access to the Plex DLNA Server
      - "32410:32410/udp" # GDM network discovery
      - "32412:32412/udp" # GDM network discovery
      - "32413:32413/udp" # GDM network discovery
      - "32414:32414/udp" # GDM network discovery
    environment:
      - TZ=${TZ}
      - HOSTNAME="Docker Plex"
      - PLEX_CLAIM=${PLEX_CLAIM} # obtain from plex.tv/claim
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
      - ADVERTISE_IP="http://SERVER-IP:32400/" # IP Address of your server, run ifconfig
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      ## Bypass router — Plex mobile/TV apps use their own auth after bypassing Authentik
      - "traefik.http.routers.plexms-rtr-bypass.rule=Host(`plex.${DOMAINNAME}`) && Header(`traefik-auth-bypass-key`,`${TRAEFIK_AUTH_BYPASS_KEY}`)"
      - "traefik.http.routers.plexms-rtr-bypass.entrypoints=websecure-internal,websecure-external"
      - "traefik.http.routers.plexms-rtr-bypass.middlewares=chain-no-auth@file"
      - "traefik.http.routers.plexms-rtr-bypass.service=plexms-svc"
      - "traefik.http.routers.plexms-rtr-bypass.priority=100"
      ## Auth router — browser access goes through Authentik
      - "traefik.http.routers.plexms-rtr.rule=Host(`plex.${DOMAINNAME}`)"
      - "traefik.http.routers.plexms-rtr.entrypoints=websecure-internal,websecure-external"
      - "traefik.http.routers.plexms-rtr.tls=true"
      - "traefik.http.routers.plexms-rtr.middlewares=secured@file"
      - "traefik.http.routers.plexms-rtr.service=plexms-svc"
      - "traefik.http.routers.plexms-rtr.priority=99"
      - "traefik.http.services.plexms-svc.loadbalancer.server.port=32400"
      - "traefik.http.services.plexms-svc.loadbalancer.server.scheme=http"
      - "traefik.docker.network=traefik_proxy"


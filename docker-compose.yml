# MariaDB – Database Server for your Apps
  mariadb:
    image: "linuxserver/mariadb"
    container_name: "mariadb"
    hostname: mariadb
    volumes:
        - ${USERDIR}/docker/mariadb:/config
        - ${USERDIR}/docker/mysql/scripts:/docker-entrypoint-initdb.d:ro
        - ${USERDIR}/docker/mysql:/var/lib/mysql/data:rw
    ports:
      - target: 3306
        published: 3306
        protocol: tcp
        mode: host
    networks:
      - traefik_proxy
      - keycloak
    restart: always
    environment:
      - MYSQL_DATABASE=keycloak
      #- MYSQL_USER=keycloak
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    healthcheck:
      # CMD-SHELL lets the container shell expand $MYSQL_ROOT_PASSWORD at runtime
      # $$ in compose YAML becomes $ after compose processing — password never hardcoded
      # NOTE: healthcheck.sh does NOT exist in linuxserver/mariadb (Alpine-based, not official MariaDB image)
      # --local (unix_socket auth) would only work if root@localhost is granted unix_socket — not guaranteed when MYSQL_ROOT_PASSWORD is set
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
      # Old healthcheck (password interpolated by compose at parse time, exposed in docker inspect):
      # test: mariadb-admin ping -h 127.0.0.1 --password=$MYSQL_ROOT_PASSWORD
      # start_period: 20s / start_interval: 1s / interval: 30s / timeout: 5s / retries: 30
      
# mysql db backup     
  db-backup:
    container_name: db-backup
    image: tiredofit/db-backup
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ${USERDIR}/docker/mariadb/backups:/backup
      - /etc/localtime:/etc/localtime:ro
    environment:
      #- DB_SERVER=mariadb
      #- USER_DBBACKUP=${PUID}
      #- GROUP_DBBACKUP=${PGID}
      - DB_NAME=ALL
      - DB_TYPE=mariadb
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD}
      - DB_DUMP_FREQ=1440
      - DB_DUMP_BEGIN=+20
      #- DB_DUMP_TARGET=${USERDIR}/docker/mariadb/backups
      - DB_CLEANUP_TIME=8640
      - CHECKSUM=SHA1
      - COMPRESSION=ZSTD
      - SPLIT_DB=TRUE
      - CONTAINER_ENABLE_MONITORING=FALSE
    networks:
      - traefik_proxy
    restart: always

# Redis - Key-value Store
  redis:
    container_name: redis
    image: redis
    restart: always
    entrypoint: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    # Previous healthcheck variants (kept for reference):
    #   test: ["CMD", "redis-cli", "--raw", "incr", "ping"]  # increments a counter each check
    #   test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
    #   test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 ping | grep 'PONG' || exit 1"]
    #   test: ["CMD-SHELL", "echo 'auth ${REDIS_PASSWORD}\nping' | redis-cli | grep PONG"]
    #   interval: 3s / timeout: 3s (too aggressive)
    networks:
      - traefik_proxy
#    ports:
#      - "6379:6379"
    sysctls:
      net.core.somaxconn: '65535'
    volumes:
      - ${USERDIR}/docker/redis/data:/data
      - /etc/localtime:/etc/localtime:ro
      #- ${USERDIR}/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    labels:
      - "traefik.enable=false"

# Redis Commander - Redis Management Tool

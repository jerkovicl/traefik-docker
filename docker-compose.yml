#version: "3.8"
services:

######### FRONTENDS ##########

# Docker Socket Proxy - Security-enhanced access to Docker API for Traefik
# Only exposes the minimal API endpoints Traefik needs (read-only containers/networks/etc)
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      socket_proxy:
    read_only: true
    tmpfs:
      - /run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOG_LEVEL=warning
      # Portainer control
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      # Granted by default
      - EVENTS=1
      - PING=1
      - VERSION=1
      # Security critical — keep disabled
      - AUTH=0
      - SECRETS=0
      - POST=1
      # Traefik needs
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - INFO=1
      # Portainer needs
      - IMAGES=1
      - VOLUMES=1
      # Dozzle needs
      - LOGS=1
      # Disabled
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - NODES=0
      - PLUGINS=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - DISABLE_IPV6=0

# Traefik Reverse Proxy
  traefik:
    hostname: traefik
    image: traefik:v3.7.1
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Static config via CLI args — replaces traefik.toml (traefik.toml kept as reference only).
    # Benefit: env vars can be expanded at runtime using {{env "VAR"}} syntax (e.g. ACME email).
    # Entrypoint architecture:
    #   web          :80  → redirects to websecure  (LAN only)
    #   web-external :81  → redirects to websecure-external (internet)
    #   websecure    :443 → LAN-only HTTPS (router does NOT forward external :443 here)
    #   websecure-external :444 → external HTTPS (router: internet :443 → Traefik :444)
    #   monitor      :8081 → healthcheck/ping
    command:
      ## Global
      - "--global.checkNewVersion=true"
      - "--global.sendAnonymousUsage=false"
      ## Logging
      - "--log=true"
      - "--log.level=ERROR"
      - "--log.filepath=/var/log/traefik/traefik.log"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--accesslog.bufferingsize=100"
      - "--accesslog.filters.statuscodes=204-299,400-499,500-599"
      - "--accesslog.filters.retryattempts=true"
      - "--accesslog.filters.minduration=10ms"
      ## API / Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=false"
      ## Ping / healthcheck (monitor entrypoint)
      - "--ping=true"
      - "--ping.entrypoint=monitor"
      ## Entrypoints — internal LAN (:80 → :443)
      - "--entrypoints.web-internal.address=:80"
      - "--entrypoints.web-internal.http.redirections.entrypoint.to=websecure-internal"
      - "--entrypoints.web-internal.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web-internal.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.web-internal.forwardedheaders.trustedips=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
      - "--entrypoints.websecure-internal.address=:443"
      - "--entrypoints.websecure-internal.http.tls=true"
      - "--entrypoints.websecure-internal.http3=true"
      - "--entrypoints.websecure-internal.http.tls.certresolver=cloudflare"
      - "--entrypoints.websecure-internal.http.tls.options=tls-opts@file"
      - "--entrypoints.websecure-internal.forwardedheaders.trustedips=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
      ## Entrypoints — external/internet (:81 → :444); router maps internet :443 → Traefik :444
      - "--entrypoints.web-external.address=:81"
      - "--entrypoints.web-external.http.redirections.entrypoint.to=websecure-external"
      - "--entrypoints.web-external.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web-external.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.web-external.forwardedheaders.trustedips=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
      - "--entrypoints.websecure-external.address=:444"
      - "--entrypoints.websecure-external.http.tls=true"
      - "--entrypoints.websecure-external.http3=true"
      - "--entrypoints.websecure-external.http.tls.certresolver=cloudflare"
      - "--entrypoints.websecure-external.http.tls.options=tls-opts@file"
      - "--entrypoints.websecure-external.forwardedheaders.trustedips=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
      ## Monitor entrypoint for healthchecks
      - "--entrypoints.monitor.address=:8081"
      ## Providers
      - "--providers.providersthrottleduration=2s"
      - "--providers.file.watch=true"
      - "--providers.file.directory=/rules"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.network=traefik_proxy"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedbydefault=false"
      ## ACME / Let's Encrypt via Cloudflare DNS challenge
      ## {{env "CF_API_EMAIL"}} is resolved at runtime from the container env var below
      - "--certificatesresolvers.cloudflare.acme.email={{env \"CF_API_EMAIL\"}}"
      - "--certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme/acme.json"
      # Uncomment to test against staging CA (avoids LE rate limits):
      # - "--certificatesresolvers.cloudflare.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.propagation.delaybeforechecks=120"
      - "--certificatesresolvers.cloudflare.acme.domains[0].main=${DOMAINNAME}"
      - "--certificatesresolvers.cloudflare.acme.domains[0].sans=*.${DOMAINNAME}"
      ## Plugins — loaded at startup; requires full container restart (not just up -d) when changed
      # Geoblock: block traffic from countries not in allowedCountries list (rules.toml)
      - "--experimental.plugins.geoblock.modulename=github.com/nscuro/traefik-plugin-geoblock"
      - "--experimental.plugins.geoblock.version=v0.14.0"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - traefik_proxy
      - socket_proxy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
      - "81:81"       # external HTTP redirect (router maps internet :80 → here)
      - "444:444"     # external HTTPS (router maps internet :443 → here)
      - "444:444/udp" # HTTP/3 (QUIC) external
    environment:
      # CF_API_EMAIL is referenced in the ACME command arg via {{env "CF_API_EMAIL"}}
      # CF_DNS_API_TOKEN is loaded from Docker secret (create a scoped DNS token in Cloudflare dashboard)
      - CF_API_EMAIL=${CLOUDFLARE_EMAIL}
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.${DOMAINNAME}`)"
      - "traefik.http.routers.traefik-rtr.entrypoints=websecure-internal"
      - "traefik.http.routers.traefik-rtr.tls=true"
      - "traefik.http.routers.traefik-rtr.service=api@internal"
      - "traefik.http.routers.traefik-rtr.middlewares=secured@file"
      - "traefik.docker.network=traefik_proxy"
    secrets:
      - cf_dns_api_token
    volumes:
      # Only mount the files Traefik actually needs — traefik.toml is NOT mounted
      # (static config is now in the command: section above)
      # NOTE: rules dir — on server run: mkdir -p ~/docker/traefik/rules && mv ~/docker/traefik/rules.toml ~/docker/traefik/rules/
      - ${USERDIR}/docker/traefik/rules:/rules:ro
      - ${USERDIR}/docker/traefik/acme:/etc/traefik/acme
      - ${USERDIR}/docker/shared:/shared
      - /var/log/docker:/var/log/docker # for fail2ban - make sure to touch file before starting container
      - ${USERDIR}/docker/traefik/logs:/var/log/traefik # access logs
      - ${USERDIR}/docker/traefik/plugins:/plugins-local # Geoblock IP2Location database
    depends_on:
      socket-proxy:
        condition: service_started

# ========== AUTHENTIK - Identity Provider & SSO (replaces Keycloak + traefik-forward-auth) ==========
# NOTE: Add AUTHENTIK_DB_PASSWORD and AUTHENTIK_SECRET_KEY to your .env file
# Initial setup: visit https://authentik.YOURDOMAIN/if/flow/initial-setup/ after first start
  authentik:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.12.1}
    container_name: authentik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: server
    networks:
      - traefik_proxy
      - default
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?err}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?err}
      AUTHENTIK_LOG_LEVEL: info
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "false"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ${USERDIR}/docker/authentik/media:/media
      - ${USERDIR}/docker/authentik/templates:/templates
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 5s
    labels:
      - "traefik.enable=true"
      # Main router — admin & login UI
      - "traefik.http.routers.authentik-rtr.rule=Host(`authentik.${DOMAINNAME}`)"
      - "traefik.http.routers.authentik-rtr.entrypoints=websecure-internal,websecure-external"
      - "traefik.http.routers.authentik-rtr.tls=true"
      - "traefik.http.routers.authentik-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.authentik-rtr.middlewares=middlewares-secure-headers@file"
      - "traefik.http.routers.authentik-rtr.service=authentik-svc"
      # Catch-all outpost router — intercepts /outpost.goauthentik.io/ on ALL subdomains for forward auth
      - "traefik.http.routers.authentik-output-rtr.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.${DOMAINNAME}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.authentik-output-rtr.entrypoints=websecure-internal,websecure-external"
      - "traefik.http.routers.authentik-output-rtr.tls=true"
      - "traefik.http.routers.authentik-output-rtr.tls.certresolver=dns-cloudflare"
      - "traefik.http.routers.authentik-output-rtr.middlewares=middlewares-secure-headers@file"
      - "traefik.http.routers.authentik-output-rtr.service=authentik-svc"
      # Service definition (shared by both routers)
      - "traefik.http.services.authentik-svc.loadbalancer.server.port=9000"
      - "traefik.docker.network=traefik_proxy"

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION:-2025.12.1}
    container_name: authentik-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: worker
    networks:
      - traefik_proxy
      - default
      - socket_proxy
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?err}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?err}
      AUTHENTIK_LOG_LEVEL: info
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "false"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ${USERDIR}/docker/authentik/media:/media
      - ${USERDIR}/docker/authentik/templates:/templates
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 5s

  postgresql:
    image: postgres:18-alpine
    container_name: postgresql
    restart: unless-stopped
    networks:
      - default
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?err}
      POSTGRES_DB: authentik
    volumes:
      - ${USERDIR}/docker/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


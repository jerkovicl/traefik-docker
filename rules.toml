# Traefik v3 dynamic configuration
# Shared middlewares and external service routes

[http.middlewares]

  # Security headers applied to all exposed services
  [http.middlewares.secure-headers.headers]
    browserXssFilter = true
    contentTypeNosniff = true
    forceSTSHeader = true
    stsSeconds = 63072000
    stsIncludeSubdomains = true
    stsPreload = true
    [http.middlewares.secure-headers.headers.customResponseHeaders]
      X-Robots-Tag = "noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex"
      Content-Security-Policy = "frame-ancestors 'self' https://EXAMPLE.COM"

  # SSO forward-auth middleware (via traefik-forward-auth)
  [http.middlewares.forward-auth.forwardAuth]
    address = "http://traefik-forward-auth:4181"
    trustForwardHeader = true
    authResponseHeaders = ["X-Forwarded-User"]

  # Combined middleware chain: forward-auth + security headers
  [http.middlewares.secured.chain]
    middlewares = ["forward-auth", "secure-headers"]

# Global TLS options (dynamic config — must NOT be in traefik.toml)
[tls.options.default]
  minVersion = "VersionTLS12"
  cipherSuites = [
    "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
    "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256",
    "TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256"
  ]

# External (non-Docker) service routes
[http.routers]
  [http.routers.hassio]
    rule = "Host(`hassio.example.com`)"
    service = "backend-hassio"
    entryPoints = ["https"]
    [http.routers.hassio.tls]

[http.services]
  [http.services.backend-hassio.loadBalancer]
    [[http.services.backend-hassio.loadBalancer.servers]]
      url = "http://LAN-IP:8123"

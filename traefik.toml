# Traefik v3 static configuration

[log]
  level = "ERROR" # DEBUG, INFO, WARN, ERROR, FATAL, PANIC

# Keep the default servers transport secure.
# If a specific backend uses a self-signed certificate, define a named
# serversTransport for that service in dynamic configuration (for example
# /etc/traefik/rules.toml) and reference it from that service only.

# Traefik dashboard
[api]
  dashboard = true

# Entry points
[entryPoints]
  [entryPoints.http]
    address = ":80"
    [entryPoints.http.http.redirections.entryPoint]
      to = "https"
      scheme = "https"
  [entryPoints.https]
    address = ":443"
    [entryPoints.https.http.tls]
      certResolver = "cloudflare"
      options = "default"
  [entryPoints.monitor]
    address = ":8081"

# Dynamic configuration provider (file-based)
[providers.file]
  watch = true
  filename = "/etc/traefik/rules.toml"

# Docker provider
[providers.docker]
  endpoint = "unix:///var/run/docker.sock"
  network = "traefik_proxy"
  watch = true
  # Only expose containers with traefik.enable=true label
  exposedByDefault = false

# Let's Encrypt / ACME via Cloudflare DNS challenge
[certificatesResolvers.cloudflare.acme]
  email = "email@domain.com" # any email id will work
  storage = "/etc/traefik/acme/acme.json"
  [certificatesResolvers.cloudflare.acme.dnsChallenge]
    provider = "cloudflare"
    delayBeforeCheck = 300
  [[certificatesResolvers.cloudflare.acme.domains]]
    main = "example.com"
    sans = ["*.example.com"]


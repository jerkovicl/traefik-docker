# Traefik v3 static configuration

[global]
  checkNewVersion = true
  sendAnonymousUsage = false

[log]
  level = "ERROR" # DEBUG, INFO, WARN, ERROR, FATAL, PANIC

[accessLog]
  filePath = "/var/log/traefik/access.log"
  format = "json"
  bufferingSize = 100
  [accessLog.filters]
    statusCodes = ["204-299", "400-499", "500-599"]
    retryAttempts = true
    minDuration = "10ms"

# Traefik dashboard
[api]
  dashboard = true
  insecure = false

# Health check endpoint — wired to the monitor entrypoint (:8081)
# Use this for Docker HEALTHCHECK, uptime monitors, or load balancer probes:
#   curl http://localhost:8081/ping
[ping]
  entryPoint = "monitor"

# Entry points
# NOTE: This file is kept as reference documentation.
# The active static config is now in docker-compose.yml under traefik.command.
# Architecture:
#   web         :80  → redirects to websecure-internal  (LAN only)
#   web-external:81  → redirects to websecure-external (internet via Cloudflare)
#   websecure-internal   :443 → LAN-only HTTPS (router does NOT forward external :443 here)
#   websecure-external :444 → external HTTPS (router forwards external :443 → Traefik :444)
#   monitor     :8081 → healthcheck/ping endpoint
[entryPoints]
  [entryPoints.web-internal]
    address = ":80"
    [entryPoints.web-internal.http.redirections.entryPoint]
      to = "websecure-internal"
      scheme = "https"
    [entryPoints.web-internal.forwardedHeaders]
      # Allow Cloudflare and local networks to set X-Forwarded-* headers
      # Cloudflare IPs: https://www.cloudflare.com/ips/
      trustedIPs = [
        "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
        "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
        "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
        "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
        "104.24.0.0/14", "172.64.0.0/13", "131.0.72.0/22",
        "2400:cb00::/32", "2606:4700::/32", "2803:f800::/32",
        "2405:b500::/32", "2405:8100::/32", "2a06:98c0::/29", "2c0f:f248::/32",
        # Local networks
        "127.0.0.1/32", "10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"
      ]
  # External HTTP redirect — router maps internet :80 → this port (:81)
  [entryPoints.web-external]
    address = ":81"
    [entryPoints.web-external.http.redirections.entryPoint]
      to = "websecure-external"
      scheme = "https"
    [entryPoints.web-external.forwardedHeaders]
      trustedIPs = [
        "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
        "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
        "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
        "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
        "104.24.0.0/14", "172.64.0.0/13", "131.0.72.0/22",
        "2400:cb00::/32", "2606:4700::/32", "2803:f800::/32",
        "2405:b500::/32", "2405:8100::/32", "2a06:98c0::/29", "2c0f:f248::/32",
        "127.0.0.1/32", "10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"
      ]
  [entryPoints.websecure-internal]
    address = ":443"
    [entryPoints.websecure-internal.http.tls]
      certResolver = "cloudflare"
      options = "default"
    [entryPoints.websecure-internal.forwardedHeaders]
      trustedIPs = [
        "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
        "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
        "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
        "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
        "104.24.0.0/14", "172.64.0.0/13", "131.0.72.0/22",
        "2400:cb00::/32", "2606:4700::/32", "2803:f800::/32",
        "2405:b500::/32", "2405:8100::/32", "2a06:98c0::/29", "2c0f:f248::/32",
        # Local networks
        "127.0.0.1/32", "10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"
      ]
  # External HTTPS — router maps internet :443 → this port (:444)
  # Services that should be internet-accessible use entrypoints=websecure-internal,websecure-external
  [entryPoints.websecure-external]
    address = ":444"
    [entryPoints.websecure-external.http.tls]
      certResolver = "cloudflare"
      options = "default"
    [entryPoints.websecure-external.forwardedHeaders]
      trustedIPs = [
        "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
        "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
        "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
        "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
        "104.24.0.0/14", "172.64.0.0/13", "131.0.72.0/22",
        "2400:cb00::/32", "2606:4700::/32", "2803:f800::/32",
        "2405:b500::/32", "2405:8100::/32", "2a06:98c0::/29", "2c0f:f248::/32",
        "127.0.0.1/32", "10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"
      ]
  [entryPoints.monitor]
    address = ":8081"

[providers]
  # Debounce config reloads if multiple files change at once
  providersThrottleDuration = "2s"

# Dynamic configuration provider (file-based)
[providers.file]
  watch = true
  filename = "/etc/traefik/rules.toml"

# Docker provider — reads container labels via socket proxy (not direct socket)
[providers.docker]
  endpoint = "tcp://socket-proxy:2375"
  network = "traefik_proxy"
  watch = true
  # Only expose containers with traefik.enable=true label
  exposedByDefault = false

# Let's Encrypt / ACME via Cloudflare DNS challenge
[certificatesResolvers.cloudflare.acme]
  email = "email@domain.com" # any email id will work
  # caServer = "https://acme-staging-v02.api.letsencrypt.org/directory" # Uncomment for testing to avoid LE rate limits
  storage = "/etc/traefik/acme/acme.json"
  [certificatesResolvers.cloudflare.acme.dnsChallenge]
    provider = "cloudflare"
    # Use Cloudflare's own resolvers to avoid delays waiting for DNS propagation
    resolvers = ["1.1.1.1:53", "1.0.0.1:53"]
  [certificatesResolvers.cloudflare.acme.dnsChallenge.propagation]
    # Wait 120s before checking DNS propagation (reduces LE API rate-limit hits)
    delayBeforeChecks = 120
  [[certificatesResolvers.cloudflare.acme.domains]]
    main = "example.com"
    sans = ["*.example.com"]

